name: CI Workflow

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests and Code Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
      - name: Build
        run: go build -o mcp-language-server
      - name: Install pinned gopls
        run: go install golang.org/x/tools/gopls@v0.23.0
      - name: Unit tests with race detector
        run: go test -race -timeout 180s . ./internal/... ./cmd/...
      - name: Code quality
        run: |
          test -z "$(gofmt -l .)"
          go tool staticcheck ./...
          go tool errcheck ./...
          find . -path "./integrationtests/workspaces" -prune -o \
            -path "./integrationtests/test-output" -prune -o \
            -name "*.go" -print | xargs gopls check
          go tool govulncheck ./...

  integration:
    name: ${{ matrix.language }} integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [go, python, rust, typescript, clangd]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@v4
        if: matrix.language == 'python' || matrix.language == 'typescript'
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        if: matrix.language == 'python'
        with:
          python-version: '3.10'
      - name: Install gopls
        if: matrix.language == 'go'
        run: go install golang.org/x/tools/gopls@v0.23.0
      - name: Install pyright
        if: matrix.language == 'python'
        run: npm install -g pyright@1.1.414
      - name: Install Rust and rust-analyzer
        if: matrix.language == 'rust'
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rust-src --component rust-analyzer
          rustup override set 1.98.1
          rust-analyzer --version
      - name: Install TypeScript server
        if: matrix.language == 'typescript'
        # TypeScript 7 no longer ships the JavaScript tsserver used by this LSP.
        run: npm install -g typescript@6.0.3 typescript-language-server@6.0.0
      - name: Install clangd and generate compile commands
        if: matrix.language == 'clangd'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-16 llvm-16 clangd-16 bear
          sudo ln -sf /usr/bin/clangd-16 /usr/local/bin/clangd
          cd integrationtests/workspaces/clangd
          bear -- make
      - name: Integration tests
        env:
          LANGUAGE: ${{ matrix.language }}
        run: go test -timeout 8m "./integrationtests/tests/$LANGUAGE/..."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: integration-failure-${{ matrix.language }}
          path: |
            integrationtests/test-output/
            integrationtests/snapshots/**/*.diff
          retention-days: 7
