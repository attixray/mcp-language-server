name: Release binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Release tests (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
      # External-language integration tests run in the full CI workflow.
      - name: Test protocol, diagnostics, file watching and core helpers
        run: go test -timeout 120s . ./internal/... ./cmd/...
      - name: Vet changed runtime packages
        run: go vet . ./internal/lsp ./internal/tools

  build:
    needs: test
    name: Package Windows x64
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
      - name: Build release archive
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('snapshot-{0}', github.sha) }}
        run: |
          python3 scripts/package_release.py --os windows --arch amd64 --version "$VERSION"
          python3 scripts/render_release_notes.py --archive "dist/mcp-language-server_${VERSION}_windows_amd64.zip" --repo "${{ github.repository }}" --output dist/RELEASE-NOTES.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows-amd64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  windows-installer:
    name: Windows x64 installer and upgrade checks
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-windows-amd64
          path: windows-package
      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          $compiler = ./scripts/ensure_inno_setup.ps1 -Destination "$env:RUNNER_TEMP/inno-setup"
          "ISCC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the installer from the release archive
        shell: pwsh
        run: |
          $archive = (Get-ChildItem windows-package/*.zip).FullName
          python scripts/package_windows_installer.py --archive "$archive" --iscc "$env:ISCC"
      - name: Test clean install, repair, locked upgrade, upgrade and uninstall
        shell: pwsh
        run: |
          $archive = (Get-ChildItem windows-package/*.zip).FullName
          python scripts/test_windows_installer.py --archive "$archive" --iscc "$env:ISCC"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows-amd64-installer
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify archives and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          cat *.sha256 | sort -k2 > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 2
          sha256sum --check SHA256SUMS
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes --notes-file RELEASE-NOTES.md "${flags[@]}"
          gh release upload "$RELEASE_TAG" ./*_windows_amd64.zip ./*_windows_amd64_setup.exe SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false
